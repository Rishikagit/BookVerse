<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="icon" type="image x-icon" href="favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="script.js"></script>
    
</head>
<body>
    <header>
        <nav>
            <img src="images/BookVerse.png" alt="logo" width="150px" height="150px">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="fiction.html">Fiction</a></li>
                <li><a href="non-fiction.html">Non-Fiction</a></li>
                <li><a href="children's books.html">Children's Books</a></li>
                <li><a href="bestsellers.html">Best Sellers</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-plus"></i>Cart</a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a></li>
            </ul>
        </nav>
    </header>
   <section class="auth-container">
    <div class="auth-box">
        <h2> Login to BookVerse</h2>
       <form>
        <input type="email" placeholder="Enter Email" id="email" required>
        <br>

        <div style="position: relative;">
        <input type="password" placeholder="Enter Password" id="password" required>
        <i class="fa-solid fa-eye" onclick="togglePassword()" style="position:absolute; top:14px; right:1px;"></i>
        
        <br>
        <button type="button" onclick="login()">Login</button>
        </div>
        <br>
        <p><a href="signup.html">Forgot Password?</a></p>
        <p id="error" style="color: red;"></p>
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
       </form>
    </div>
   </section>
</html>
